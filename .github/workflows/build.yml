name: Build apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  desktop:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: ytdl-mac-apple-silicon
          - os: macos-15-intel
            name: ytdl-mac-intel
          - os: windows-latest
            name: ytdl-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stamp the release version into the app
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "__version__ = \"${GITHUB_REF_NAME#v}\"" > desktop/version.py
      - name: Install dependencies
        working-directory: desktop
        run: pip install -r requirements.txt -r requirements-build.txt
      - name: Build app
        working-directory: desktop
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ICON=../assets/icon.ico; SEP=";"; EXTRA="--onefile"
          else
            ICON=../assets/icon.icns; SEP=":"; EXTRA=""
          fi
          pyinstaller --noconfirm --windowed $EXTRA --name ytdl --icon "$ICON" \
            --add-data "../assets/icon.png${SEP}assets" \
            --collect-all yt_dlp --collect-all imageio_ffmpeg main.py
      - name: Check the built app starts (Mac)
        if: runner.os == 'macOS'
        run: desktop/dist/ytdl.app/Contents/MacOS/ytdl --help > /dev/null
      - name: Check the built app starts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath desktop\dist\ytdl.exe -ArgumentList '--help' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "ytdl.exe --help exited with code $($p.ExitCode)" }
      - name: Package (Mac)
        if: runner.os == 'macOS'
        working-directory: desktop/dist
        run: ditto -c -k --sequesterRsrc --keepParent ytdl.app "../../${{ matrix.name }}.zip"
      - name: Package (Mac disk image)
        if: runner.os == 'macOS'
        run: |
          mkdir stage
          ditto desktop/dist/ytdl.app stage/ytdl.app
          ln -s /Applications stage/Applications
          hdiutil create -quiet -volname ytdl -srcfolder stage -format UDZO "${{ matrix.name }}.dmg"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp desktop/dist/ytdl.exe "${{ matrix.name }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.zip
            ${{ matrix.name }}.dmg
            ${{ matrix.name }}.exe

  android:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ARGS=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
            IFS=. read -r MAJOR MINOR PATCH <<< "$V"
            ARGS="-PappVersion=$V -PappVersionCode=$((MAJOR * 10000 + MINOR * 100 + PATCH))"
          fi
          ./gradlew --no-daemon :app:assembleDebug $ARGS
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-universal-debug.apk ytdl-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ytdl-android
          path: ytdl-android.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
