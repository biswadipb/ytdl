name: Screenshots

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install a virtual display, Tk and fonts
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk fonts-dejavu-core
      - run: pip install -r desktop/requirements.txt
      - name: Take screenshots of the real window
        run: xvfb-run -a -s "-screen 0 1500x1200x24" python tools/screenshots_desktop.py docs/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-desktop
          path: docs/screenshots/*.png

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the app
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug
      - name: Allow the emulator to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Take screenshots in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/android_screens.sh docs/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-android
          path: docs/screenshots/*.png

  minimal-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install a virtual display, Tk and fonts
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk fonts-dejavu-core
      - run: pip install -r minimal/desktop/requirements.txt
      - name: Take screenshots of the real window
        run: xvfb-run -a -s "-screen 0 1200x1000x24" python tools/screenshots_minimal_desktop.py docs/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-minimal-desktop
          path: docs/screenshots/minimal-desktop-*.png

  minimal-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the app
        working-directory: minimal/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug
      - name: Allow the emulator to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Take screenshots in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/android_screens_minimal.sh docs/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-minimal-android
          path: docs/screenshots/minimal-android-*.png

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r desktop/requirements.txt
      - name: Try for a bigger screen so the windows fit
        shell: pwsh
        continue-on-error: true
        run: |
          Install-Module -Name DisplayConfig -Force -Scope CurrentUser -ErrorAction Stop
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds | Out-String
      - name: Full app
        run: python tools/screenshots_desktop.py docs/screenshots/windows
      - name: Minimal app
        run: python tools/screenshots_minimal_desktop.py docs/screenshots/windows
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-windows
          path: docs/screenshots/windows/*.png
