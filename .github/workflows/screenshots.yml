name: Screenshots

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install a virtual display, Tk and fonts
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk fonts-dejavu-core
      - run: pip install -r desktop/requirements.txt
      - name: Take screenshots of the real window
        run: xvfb-run -a -s "-screen 0 1500x1200x24" python tools/screenshots_desktop.py docs/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-desktop
          path: docs/screenshots/*.png

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the app
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug
      - name: Allow the emulator to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Take screenshots in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/android_screens.sh docs/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-android
          path: docs/screenshots/*.png
