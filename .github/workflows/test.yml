name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:   # build.yml runs these first, so a failing test blocks the release

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install a virtual display for the window tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - name: Install dependencies
        working-directory: desktop
        run: pip install -r requirements.txt pytest
      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        working-directory: desktop
        env:
          YTDL_NETWORK_TESTS: "1"   # also tries the real YouTube; skipped if YouTube blocks the runner
        run: xvfb-run -a python -m pytest -q
      - name: Run tests
        if: runner.os != 'Linux'
        working-directory: desktop
        run: python -m pytest -q

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and lint
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug
